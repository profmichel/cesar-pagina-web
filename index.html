<!DOCTYPE html>

<body>
    <header>
    </header>
    <main>
        <hr>

        <h2>Usando float para alinhar imagens</h2>
        <p>A propriedade float pode ser usada para alinhar imagens à esquerda ou à direita do texto:</p>
        <p>
            <img src="logo-cep.jpg" alt="Logo" style="float: right; width: 100px;">
            Este texto ficará ao lado da imagem, que está alinhada à direita
        </p>

        <hr>

        <h2>Centralizar uma imagem</h2>
        <div style="text-align: center; width: 100px;">
            <img src="logo-cep.jpg" alt="Imagem Centralizada">
        </div>

        <hr>
        
        <h2>Posicionamento Absoluto</h2>
        <div style="position: relative; height: 300px;">
            <img src="logo-cep.jpg" alt="logo" style="position: absolute; top: 50px; left: 100px;">
        </div>

    </main>
</body>

</html>
