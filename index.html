<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        main{
            max-width: 800px;
            margin:0 auto;
        }
img {
    width: 115px;
    height: 100px;
}
    </style>
</head>

<body>
    <header>
    </header>
    <main>
        <hr>

        <h2>Usando float para alinhar imagens </h2>
        <p>
            <img src="logo-cep.jpg" alt="Logo" style="float: right; width: 115px; height: 100px;">
            Este texto ficará ao lado da imagem, que está alinhada à direita
        </p>
        <br> <br> <br>

        <hr>

        <h2>Usando float para alinhar imagens</h2>
        <p>
            <img src="logo-cep.jpg" alt="Logo" style="float: left; width: 115px; height: 100px;">
            Este texto ficará ao lado da imagem, que está alinhada à direita
        </p>
        <br> <br> <br>
        <hr>

        <h2>Centralizar uma imagem</h2>
        <div style="text-align: center;">
            <img src="logo-cep.jpg" alt="Imagem Centralizada">
        </div>

        <hr>
    </main>
</body>

</html>
